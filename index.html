<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Gaurav Agarwal Tower</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Gaurav Agarwal's portfolio as an 828 m tower: ride the lift from the lobby to the spire and step out on every floor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: first-person view from inside the tower. Lift panel on the left, floor card on the right
   (a bottom sheet on phones), steel lift doors that close over the whole view between floors.
   One deliberate look: dark glass instruments with brass, over rooms that are lit like real interiors. */
:root {
  --glass: rgba(10, 17, 30, 0.74);
  --glass-hi: rgba(18, 28, 46, 0.9);
  --fg: #eef2f6;
  --mute: #a3b2c4;
  --line: rgba(214, 226, 240, 0.16);
  --brass: #e3b96c;
  --brass-ink: #1d1407;
  --led: #ffb547;
  --steel-1: #7f8890;
  --steel-2: #c9d0d6;
  --steel-3: #9ba4ad;
  --cabin: #17191c;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Instrument Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--cabin);
  color: var(--fg);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#scene canvas:active { cursor: grabbing; }
::selection { background: var(--brass); color: var(--brass-ink); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }

.glass {
  background: var(--glass);
  border: 1px solid var(--line);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  box-shadow: 0 10px 40px rgba(4, 8, 16, 0.35);
}

/* ---------- lift doors (seen from inside the cabin) ---------- */
.lift { position: fixed; inset: 0; z-index: 15; pointer-events: none; overflow: hidden; }
.door {
  position: absolute; top: 0; bottom: 0; width: 50.4%;
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 3px),
    linear-gradient(90deg, var(--steel-1), var(--steel-2) 38%, var(--steel-3) 62%, var(--steel-1));
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25), inset 0 30px 60px rgba(0, 0, 0, 0.35), inset 0 -40px 60px rgba(0, 0, 0, 0.3);
  transition: transform 0.95s cubic-bezier(0.65, 0, 0.3, 1);
  pointer-events: auto;
}
.door.l { left: 0; border-right: 2px solid rgba(0, 0, 0, 0.45); }
.door.r { right: 0; border-left: 1px solid rgba(255, 255, 255, 0.25); }
.lift[data-state="open"] .door { pointer-events: none; }
.lift[data-state="open"] .door.l { transform: translateX(-101%); }
.lift[data-state="open"] .door.r { transform: translateX(101%); }
.lift-head {
  position: absolute; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; padding: 8px 18px; border-radius: 6px;
  background: #0a0a0b; border: 1px solid #2a2c30; box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8), 0 4px 18px rgba(0, 0, 0, 0.4);
  font: 600 30px/1 var(--font-mono); color: var(--led); text-shadow: 0 0 10px rgba(255, 181, 71, 0.7);
  font-variant-numeric: tabular-nums; transition: opacity 0.4s;
}
.lift-head .arrow { font-size: 18px; opacity: 0.35; }
.lift.moving .lift-head .arrow { opacity: 1; animation: blink 0.7s steps(2) infinite; }
.lift[data-state="open"] .lift-head { opacity: 0; }
.lift-msg {
  position: absolute; left: 50%; bottom: calc(18% + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font: 500 12px/1.4 var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: rgba(20, 24, 28, 0.75);
  text-align: center; transition: opacity 0.3s; white-space: nowrap;
}
.lift[data-state="open"] .lift-msg { opacity: 0; }
.lift.moving .door { animation: hum 0.18s linear infinite alternate; }
@keyframes hum { from { margin-top: 0; } to { margin-top: 1px; } }
@keyframes blink { 50% { opacity: 0.3; } }

/* ---------- top bar ---------- */
.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gutter-r) 0 var(--gutter-l);
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.top-right { display: flex; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; padding: 8px 14px; border-radius: 10px; text-decoration: none; }
.brand b { font: 800 22px/1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
.brand span { font: 400 12px/1 var(--font-mono); color: var(--mute); }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px;
  font-weight: 600; font-size: 14px; border: 1px solid var(--line);
}
.pill svg { width: 14px; height: 14px; flex: none; }
.tour-btn { background: var(--brass); color: var(--brass-ink); border-color: transparent; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
.tour-btn:hover { filter: brightness(1.06); }
.sound-btn { padding: 10px 12px; }
.sound-btn[aria-pressed="true"] { color: var(--brass); }

/* ---------- lift panel ---------- */
.elevator {
  position: fixed; z-index: 20; left: var(--gutter-l); top: calc(80px + env(safe-area-inset-top, 0px));
  bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  width: 156px; display: flex; flex-direction: column; gap: 12px;
}
.readout { border-radius: 12px; padding: 12px 14px 10px; }
.readout .lbl { font: 500 10px/1 var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); }
.readout .num {
  font: 800 64px/0.95 var(--font-display); color: var(--brass); font-variant-numeric: tabular-nums;
  margin-top: 6px; text-shadow: 0 0 18px rgba(227, 185, 108, 0.35);
}
.readout .alt { font: 400 12px/1.2 var(--font-mono); color: var(--fg); margin-top: 6px; font-variant-numeric: tabular-nums; }
.rail {
  flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none;
  display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: 6px;
  border-radius: 12px; padding: 8px 6px;
}
.rail::-webkit-scrollbar { display: none; }
.zone { display: flex; flex-direction: column-reverse; gap: 1px; }
.zone h3 {
  margin: 0; padding: 4px 6px 2px; font: 500 9.5px/1.2 var(--font-mono); letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--mute);
}
.stop {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 2px 6px; border: 0; border-radius: 6px;
  background: transparent; text-align: left; font-size: 12px; line-height: 1.25; color: var(--mute);
}
.stop i { flex: none; order: 0; width: 26px; font: 500 10.5px/1 var(--font-mono); font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
.stop::before { content: ""; flex: none; order: 1; width: 7px; height: 7px; border-radius: 50%; border: 1px solid currentColor; opacity: 0.7; }
.stop span { order: 2; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop:hover { color: var(--fg); background: rgba(255, 255, 255, 0.06); }
.stop[aria-current="true"] { color: var(--fg); background: rgba(227, 185, 108, 0.14); }
.stop[aria-current="true"]::before { background: var(--brass); border-color: var(--brass); opacity: 1; box-shadow: 0 0 8px var(--brass); }
.stop[aria-current="true"] i { color: var(--brass); }

/* ---------- floor card ---------- */
.card {
  position: fixed; z-index: 20; right: var(--gutter-r); top: calc(80px + env(safe-area-inset-top, 0px));
  width: min(390px, calc(100vw - 32px));
  max-height: calc(100% - 80px - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto; border-radius: 16px; outline: none; overscroll-behavior: contain;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
body.riding .card { opacity: 0; transform: translateY(12px); pointer-events: none; }
.card-inner { padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 14px; }
.card.min .card-inner > :not(.head) { display: none; }
.head { display: flex; flex-direction: column; gap: 10px; }
.head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.min-btn {
  flex: none; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05);
  font: 500 11px/1.2 var(--font-mono); color: var(--mute);
}
.min-btn:hover { color: var(--fg); }
.progress { position: sticky; top: 0; height: 3px; z-index: 1; }
.progress b { display: block; height: 100%; width: 0; background: var(--brass); }
.progress.run b { animation: fill var(--step, 9s) linear forwards; }
@keyframes fill { to { width: 100%; } }
.eyebrow {
  margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  font: 500 11px/1.2 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute);
}
.eyebrow .lvl { color: var(--brass-ink); background: var(--brass); padding: 3px 7px; border-radius: 4px; letter-spacing: 0.06em; }
.card h2 { margin: 0; font: 800 40px/0.98 var(--font-display); letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance; }
.card .sub { margin: 0; color: var(--mute); font-size: 14px; }
.stats {
  margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; border-radius: 10px; overflow: hidden;
  background: var(--line); border: 1px solid var(--line);
}
.stats div { background: var(--glass-hi); padding: 10px 12px; display: flex; flex-direction: column-reverse; min-width: 0; }
.stats div.wide { grid-column: span 2; }
.stats dt { font: 400 10.5px/1.3 var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--mute); margin-top: 3px; }
.stats dd { margin: 0; font: 800 24px/1 var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.body { margin: 0; font-size: 15px; line-height: 1.6; max-width: 62ch; }
.list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.list li { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
.list li b { grid-column: 2; font-weight: 600; }
.list li span { grid-column: 2; color: var(--mute); font-size: 13.5px; }
.list li em { grid-row: span 2; font: 500 11px/1.9 var(--font-mono); font-style: normal; color: var(--brass); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 999px;
  font-size: 14px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06);
}
.btn:hover { background: rgba(255, 255, 255, 0.12); }
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.email { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.email code {
  user-select: all; -webkit-user-select: all; font: 400 13px/1 var(--font-mono); padding: 10px 12px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--glass-hi);
}
.note { margin: 0; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 12.5px; color: var(--mute); line-height: 1.45; }
.note b { color: var(--fg); font-weight: 600; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.nav button {
  display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04); text-align: left;
}
.nav button:last-child { text-align: right; align-items: flex-end; }
.nav button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }
.nav button:disabled { opacity: 0.35; cursor: default; }
.nav small { font: 500 10px/1.2 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); }
.nav span { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.hint {
  position: fixed; z-index: 10; left: var(--gutter-l); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font: 400 12px/1.3 var(--font-mono); color: var(--fg); padding: 7px 12px; border-radius: 8px;
}
.hint kbd { font: inherit; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; }
body.no-gl .lift-msg::after { content: " · 3D view unavailable here"; }

/* ---------- outside: floor tags; inside: the "read more" spot ---------- */
#tags, #spots { position: fixed; inset: 0; z-index: 12; pointer-events: none; overflow: hidden; }
body:not(.outside) #tags, body.outside #spots, body.riding #spots, body.veiled #tags { display: none; }
.tag {
  position: absolute; left: 0; top: 0; pointer-events: auto; display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px 4px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass);
  color: var(--fg); font: 500 11.5px/1.2 var(--font-body); white-space: nowrap;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: background-color 0.15s;
}
.tag i { font: 600 10.5px/1 var(--font-mono); font-style: normal; color: var(--brass); }
.tag::after { content: ""; position: absolute; top: 50%; width: 14px; height: 1px; background: var(--brass); opacity: 0.8; }
.tag.l::after { right: -14px; }
.tag.r::after { left: -14px; }
.tag:hover, .tag[aria-current="true"] { background: var(--brass); color: var(--brass-ink); border-color: transparent; z-index: 1; }
.tag:hover i, .tag[aria-current="true"] i { color: var(--brass-ink); }
.tag.gate { background: var(--brass); color: var(--brass-ink); font-weight: 600; font-size: 13.5px; padding: 8px 16px; border: 0; animation: pulse 2s ease-in-out infinite; }
.tag.gate::after { left: 50%; top: 100%; width: 1px; height: 18px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(227, 185, 108, 0.2); } }
.spot {
  position: absolute; left: 0; top: 0; pointer-events: auto; display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px 7px 8px; border-radius: 999px; border: 0; background: var(--brass); color: var(--brass-ink);
  font: 600 13px/1.2 var(--font-body); white-space: nowrap; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
}
.spot b {
  width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--brass-ink); color: var(--brass);
  font: 700 12px/1 var(--font-mono); animation: pulse 2s ease-in-out infinite;
}

/* ---------- veil between outside and inside ---------- */
.veil {
  position: fixed; inset: 0; z-index: 40; background: #07090c; opacity: 1; pointer-events: auto; display: grid; place-items: center;
  font: 500 12px/1 var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); transition: opacity 0.5s ease;
}
body:not(.veiled) .veil { opacity: 0; pointer-events: none; }
body.outside .lift, body.outside .readout .alt { display: none; }

/* ---------- details sheet ---------- */
.modal {
  position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; background: rgba(4, 7, 12, 0.55);
  padding: calc(20px + env(safe-area-inset-top, 0px)) var(--gutter-r) calc(20px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
}
.sheet { width: min(640px, 100%); max-height: 100%; overflow-y: auto; border-radius: 18px; outline: none; overscroll-behavior: contain; }
.sheet-inner { padding: 26px 28px 24px; display: flex; flex-direction: column; gap: 16px; }
.sheet .close {
  align-self: flex-end; margin: -8px -10px -40px 0; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.06); font: 500 12px/1.2 var(--font-mono); color: var(--mute);
}
.sheet .close:hover { color: var(--fg); }
.sheet h2 { margin: 0; font: 800 46px/0.98 var(--font-display); text-transform: uppercase; text-wrap: balance; padding-right: 70px; }
.sheet h3 { margin: 4px 0 0; font: 500 11px/1.2 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass); }
.details { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.details li { position: relative; padding-left: 22px; line-height: 1.55; max-width: 62ch; }
.details li::before { content: ""; position: absolute; left: 3px; top: 0.62em; width: 7px; height: 7px; background: var(--brass); transform: rotate(45deg); }
.hintline { margin: 0; font-size: 13.5px; color: var(--mute); }
.hintline b { color: var(--brass); font-weight: 600; }
.exit-btn { background: rgba(255, 255, 255, 0.06); }

/* ---------- phones ---------- */
@media (max-width: 820px) {
  .brand span { display: none; }
  .brand b { font-size: 18px; }
  .pill { padding: 9px 13px; font-size: 13px; }
  .lift-head { top: auto; bottom: calc(52% + 16px); font-size: 24px; }
  .elevator { top: calc(68px + env(safe-area-inset-top, 0px)); bottom: auto; width: auto; }
  .readout { padding: 8px 12px; display: grid; grid-template-columns: auto auto; column-gap: 10px; align-items: end; }
  .readout .lbl { grid-column: 1 / -1; }
  .readout .num { font-size: 38px; margin-top: 4px; }
  .readout .alt { margin: 0 0 4px; }
  .rail, .hint { display: none; }
  .card {
    top: auto; left: var(--gutter-l); right: var(--gutter-r); width: auto;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 48%;
  }
  .card-inner { padding: 18px 18px 14px; gap: 12px; }
  .card h2 { font-size: 32px; }
  .tag { font-size: 10.5px; padding: 3px 8px 3px 6px; }
  .tag span { display: none; }
  .sheet h2 { font-size: 36px; }
  .sheet-inner { padding: 22px 20px; }
  #modeBtn span { display: none; }
  .stats dd { font-size: 20px; }
}
@media (max-height: 640px) and (min-width: 821px) { .readout .num { font-size: 44px; } }
@media (prefers-reduced-motion: reduce) {
  .door { transition-duration: 0.01s; }
  .lift.moving .door, .lift.moving .lift-head .arrow { animation: none; }
  .progress.run b { animation: none; width: 0; }
}
</style>

<div id="scene" aria-hidden="true"></div>
<div id="tags"></div>
<div id="spots"></div>
<div class="veil" id="veil">Building the tower…</div>

<div class="lift moving" id="lift" data-state="closed" aria-hidden="true">
  <div class="door l"></div><div class="door r"></div>
  <div class="lift-head"><span class="arrow">▲</span><b id="liftNum">G</b></div>
  <div class="lift-msg" id="liftMsg">Doors opening shortly</div>
</div>

<header class="top">
  <a class="brand glass" href="#lobby" id="brand"><b>Gaurav Agarwal</b><span>828 m · 19 floors</span></a>
  <div class="top-right">
    <button class="pill glass" id="modeBtn" type="button"></button>
    <button class="pill glass sound-btn" id="soundBtn" type="button" aria-pressed="false" aria-label="Lift chime"></button>
    <button class="pill tour-btn" id="tourBtn" type="button" aria-pressed="false"></button>
  </div>
</header>

<nav class="elevator" aria-label="Floors">
  <div class="readout glass">
    <div class="lbl" id="roLbl">Floor</div>
    <div class="num" id="roNum">G</div>
    <div class="alt" id="roAlt">0 m above ground</div>
  </div>
  <div class="rail glass" id="rail"></div>
</nav>

<article class="card glass" id="card" tabindex="-1" aria-live="polite">
  <div class="progress" id="progress"><b></b></div>
  <div class="card-inner" id="cardInner"></div>
</article>

<div class="hint glass" id="hint"></div>

<div class="modal" id="detail" hidden>
  <article class="sheet glass" id="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></article>
</div>

<script>
// All site copy lives in FLOORS. Floors run ground to top; m is height above ground in metres.
const EMAIL = "gauravag0808@gmail.com";
const LINKEDIN = "https://www.linkedin.com/in/gaurav-agarwal-ga0202/";
const GITHUB = "https://github.com/Bittu25";

const ZONES = {
  lobby: { name: "Lobby", note: "<b>The ground floor.</b> Everyone comes in here." },
  foundations: { name: "Foundations", note: "<b>Foundations</b> are the part of a tower you never see. They carry everything above." },

// ---- rail ----
function buildRail() {
  const rail = $("rail");
  const groups = [];
  FLOORS.forEach((f, i) => {
    const last = groups[groups.length - 1];
    if (!last || last.zone !== f.zone) groups.push({ zone: f.zone, items: [] });
    groups[groups.length - 1].items.push(i);
  });
  rail.innerHTML = groups
    .map(
      (g) =>
        `<div class="zone">${g.items
          .map((i) => {
            const f = FLOORS[i];
            return `<button class="stop" type="button" data-i="${i}" aria-label="${esc(levelLabel(f) + ", " + f.title)}"><i>${esc(f.level)}</i><span>${esc(f.title)}</span></button>`;
          })
          .join("")}<h3>${esc(ZONES[g.zone].name)}</h3></div>`
    )
    .join("");
  rail.addEventListener("click", (e) => {
    const b = e.target.closest(".stop");
    if (b) go(+b.dataset.i);
  });
}
function markRail(i) {
  document.querySelectorAll(".stop").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.i === i)));
  if (i != null) document.querySelector(`.stop[data-i="${i}"]`)?.scrollIntoView({ block: "nearest" });
}

// ---- floor content, shared by the card and the details sheet ----
function statsHtml(f) {
  if (!f.stats) return "";
  // an odd tile out spans both columns so the grid never leaves a hole
  const halves = f.stats.filter((s) => !s.wide);
  const lone = halves.length % 2 ? halves[halves.length - 1] : null;
  return `<dl class="stats">${f.stats.map((s) => `<div class="${s.wide || s === lone ? "wide" : ""}"><dt>${esc(s.l)}</dt><dd>${esc(s.v)}</dd></div>`).join("")}</dl>`;
}
function linksHtml(f, primary) {
  const a = (f.links || []).map((l, k) => `<a class="btn${primary && k === 0 ? " primary" : ""}" href="${esc(l.href)}" target="_blank" rel="noreferrer">${esc(l.label)} ↗</a>`);
  return a.length ? `<div class="actions">${a.join("")}</div>` : "";
}
function headHtml(f, minBtn) {
  return `<div class="head"><div class="head-row"><p class="eyebrow"><span class="lvl">${esc(badge(f))}</span>${esc(ZONES[f.zone].name)} · ${f.m} m</p>${minBtn ? `<button class="min-btn" type="button" data-act="min" aria-expanded="true">Hide</button>` : ""}</div><h2>${esc(f.title)}</h2>${f.sub ? `<p class="sub">${esc(f.sub)}</p>` : ""}</div>`;
}
function navHtml(i) {
  const prev = FLOORS[i - 1], next = FLOORS[i + 1];
  return `<div class="nav">
      <button type="button" data-act="down" ${prev ? "" : "disabled"}><small>↓ Down</small><span>${prev ? esc(prev.title) : "Ground floor"}</span></button>
      <button type="button" data-act="up" ${next ? "" : "disabled"}><small>Up ↑</small><span>${next ? esc(next.title) : "Top of the tower"}</span></button>

}
const boardName = (f) => (f.id === "lobby" ? "name wall" : f.id === "bits" ? "chalkboard" : f.id === "epik" ? "kanban board" : f.id === "alokbansal" ? "departures board" : f.zone === "projects" ? "big screen" : f.id === "process" ? "machines" : f.id === "services" ? "suite signs" : f.id === "atthetop" ? "lightboxes" : f.id === "contact" ? "contact card" : f.id === "spire" ? "spire plate" : "board");

// ---- readouts: the panel and the indicator above the doors roll through the floors ----

        g.fillRect(x, 0, 26, h);
        g.fillStyle = "#1a120c";
        g.fillRect(x + 26, 0, 6, h);
      }
    }, true)
  );
  T.paving = shared(
    cvt(512, 512, (g, w, h) => {
      g.fillStyle = "#d9cdb8";
      g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 64)
        for (let x = 0; x < w; x += 128) {
          g.fillStyle = `hsl(36, 22%, ${rnd(74, 82)}%)`;
          g.fillRect(x + ((y / 64) % 2) * 64 + 1, y + 1, 126, 62);
        }
    }, true)
  );
  T.sand = shared(
    cvt(512, 512, (g, w, h) => {
      g.fillStyle = "#d2b98f";
      g.fillRect(0, 0, w, h);
      speckle(g, w, h, 14000, "rgba(120,90,50,0.12)", 2);
    }, true)
  );
  T.cardboard = shared(
    cvt(256, 256, (g, w, h) => {
      g.fillStyle = "#b98c57";
      g.fillRect(0, 0, w, h);
      speckle(g, w, h, 3000, "rgba(90,60,30,0.12)", 1.5);
      g.fillStyle = "rgba(225,205,160,0.75)";
      g.fillRect(w / 2 - 18, 0, 36, h);
    })
  );
  T.blob = shared(
    cvt(128, 128, (g, w, h) => {
      const rg = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      rg.addColorStop(0, "rgba(0,0,0,0.55)");
      rg.addColorStop(0.6, "rgba(0,0,0,0.25)");
      rg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = rg;
      g.fillRect(0, 0, w, h);
    })
  );
  // city facades, day map and night window lights
  T.city = shared(
    cvt(256, 256, (g, w, h) => {
      g.fillStyle = "#7f8f9e";
      g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 8) {
        g.fillStyle = "rgba(30,40,52,0.45)";
        g.fillRect(0, y, w, 3);
      }
      for (let x = 0; x < w; x += 16) {
        g.fillStyle = "rgba(220,228,236,0.4)";
        g.fillRect(x, 0, 2, h);
      }
    }, true)
  );
  T.cityLights = shared(
    cvt(256, 256, (g, w, h) => {
      g.fillStyle = "#000";
      g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 8)
        for (let x = 0; x < w; x += 16)
          if (Math.random() < 0.38) {
            g.fillStyle = `hsl(${rnd(30, 45)}, 90%, ${rnd(50, 75)}%)`;
            g.fillRect(x + 3, y + 3, 11, 4);
          }
    }, true)
  );
  T.cloud = shared(
    cvt(256, 256, (g, s) => {
      for (let i = 0; i < 9; i++) {
        const x = s * rnd(0.25, 0.75), y = s * rnd(0.4, 0.6), r = s * rnd(0.14, 0.3);
        const rg = g.createRadialGradient(x, y, 0, x, y, r);
        rg.addColorStop(0, "rgba(255,255,255,0.55)");
        rg.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = rg;
        g.fillRect(0, 0, s, s);
      }
    })
  );
}

// ---------- geometry helpers ----------
const mesh = (geo, mat) => new THREE.Mesh(geo, mat);
const B = (w, h, d, mat, r = 0) => mesh(r ? new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001)) : new THREE.BoxGeometry(w, h, d), mat);
const C = (rt, rb, h, mat, seg = 24, open = false) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), mat);
const P = (w, h, mat) => mesh(new THREE.PlaneGeometry(w, h), mat);
const S = (r, mat, ws = 20, hs = 14) => mesh(new THREE.SphereGeometry(r, ws, hs), mat);
function put(parent, o, x = 0, y = 0, z = 0, ry = 0, rx = 0, rz = 0) {
  o.position.set(x, y, z);
  o.rotation.set(rx, ry, rz);
  parent.add(o);
  return o;
}
function grp(parent, x = 0, y = 0, z = 0, ry = 0) {
  return put(parent, new THREE.Group(), x, y, z, ry);
}
const basic = (map, o = {}) => new THREE.MeshBasicMaterial({ map, toneMapped: false, ...o });
const std = (o) => new THREE.MeshStandardMaterial(o);
const blob = (p, w, d, x = 0, z = 0) => put(p, P(w, d, M.shadow), x, 0.008, z, 0, -Math.PI / 2);
// a cylinder between two points (pipes, braces, rails)
function rod(p, a, b, r, mat, seg = 10) {
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const len = va.distanceTo(vb);
  const m = C(r, r, len, mat, seg);
  m.position.copy(va).add(vb).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vb.clone().sub(va).normalize());
  p.add(m);
  return m;
}
// a framed screen that glows
function screen(p, w, h, tex, x, y, z, ry = 0, bezel = 0.03) {
  const g = grp(p, x, y, z, ry);
  put(g, B(w + bezel * 2, h + bezel * 2, 0.04, M.black, 0.01), 0, 0, 0);
  put(g, P(w, h, basic(tex)), 0, 0, 0.021);
  return g;
}
// a printed or painted panel (lit by the room)
function panel(p, w, h, tex, x, y, z, ry = 0, o = {}) {
  return put(p, P(w, h, std({ map: tex, roughness: 0.8, transparent: !!o.transparent, ...o })), x, y, z, ry);
}
// wall frame: local +z points into the room and local +x is to the right of someone facing the wall
function wallFrame(p, side, w, d) {
  const [x, z, ry] = { front: [0, -d / 2, 0], back: [0, d / 2, Math.PI], left: [-w / 2, 0, Math.PI / 2], right: [w / 2, 0, -Math.PI / 2] }[side];
  return grp(p, x, 0, z, ry);
}

// ---------- furniture ----------
function desk(p, x, z, ry = 0, o = {}) {
  const w = o.w || 1.6, d = o.d || 0.8;
  const g = grp(p, x, 0, z, ry);
  put(g, B(w, 0.04, d, o.top || M.white, 0.01), 0, 0.74, 0);
  for (const sx of [-1, 1]) put(g, B(0.05, 0.72, d - 0.1, M.steelDark), sx * (w / 2 - 0.06), 0.36, 0);
  put(g, B(w - 0.2, 0.3, 0.02, M.steelDark), 0, 0.55, d / 2 - 0.12);
  blob(g, w + 0.4, d + 0.4);
  return g;
}
function chair(p, x, z, ry = 0, mat = M.fabric) {
  const g = grp(p, x, 0, z, ry);
  put(g, B(0.5, 0.08, 0.48, mat, 0.03), 0, 0.48, 0);
  put(g, B(0.46, 0.56, 0.06, mat, 0.025), 0, 0.84, 0.25, 0, -0.12);
  put(g, C(0.025, 0.025, 0.38, M.steel, 8), 0, 0.27, 0);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    put(g, B(0.3, 0.03, 0.04, M.black), Math.cos(a) * 0.15, 0.06, Math.sin(a) * 0.15, -a);
    put(g, S(0.025, M.black, 8, 6), Math.cos(a) * 0.29, 0.03, Math.sin(a) * 0.29);
  }
  blob(g, 0.8, 0.8);
  return g;
}
function monitor(p, x, y, z, ry, tex, w = 0.6, h = 0.34) {
  const g = grp(p, x, y, z, ry);
  screen(g, w, h, tex, 0, 0.3, 0, 0, 0.012);
  put(g, B(0.04, 0.16, 0.03, M.steelDark), 0, 0.08, -0.04);
  put(g, B(0.22, 0.012, 0.16, M.steelDark, 0.005), 0, 0.006, -0.02);
  return g;
}
function laptop(p, x, y, z, ry, tex) {
  const g = grp(p, x, y, z, ry);
  put(g, B(0.34, 0.014, 0.24, M.steel, 0.005), 0, 0.007, 0);
  const lid = grp(g, 0, 0.014, -0.12, 0);
  lid.rotation.x = -0.28;
  put(lid, B(0.34, 0.23, 0.008, M.steel, 0.003), 0, 0.115, 0);
  if (tex) put(lid, P(0.31, 0.2, basic(tex)), 0, 0.118, 0.0045);
  return g;
}
function plant(p, x, z, s = 1, dark = false) {
  const g = grp(p, x, 0, z, rnd(Math.PI * 2));
  put(g, C(0.24 * s, 0.18 * s, 0.5 * s, dark ? M.potDark : M.pot, 24), 0, 0.25 * s, 0);
  put(g, C(0.22 * s, 0.22 * s, 0.02, M.soil, 20), 0, 0.49 * s, 0);
  put(g, C(0.02 * s, 0.03 * s, 0.9 * s, M.woodDark, 6), 0, 0.9 * s, 0);
  const leafGeo = new THREE.IcosahedronGeometry(0.22 * s, 1);
  for (let i = 0; i < 16; i++) {
    const a = rnd(Math.PI * 2), r = rnd(0.05, 0.38) * s, y = rnd(0.75, 1.65) * s;
    const m = mesh(leafGeo, i % 3 ? M.leaf : M.leaf2);
    m.scale.set(rnd(0.7, 1.2), rnd(0.5, 0.8), rnd(0.7, 1.2));
    put(g, m, Math.cos(a) * r, y, Math.sin(a) * r, rnd(3), rnd(1));
  }
  blob(g, 0.9 * s, 0.9 * s);
  return g;
}
function sofa(p, x, z, ry = 0, w = 2.2, mat = M.fabricWarm) {
  const g = grp(p, x, 0, z, ry);
  put(g, B(w, 0.38, 0.92, mat, 0.06), 0, 0.21, 0);
  put(g, B(w, 0.48, 0.22, mat, 0.07), 0, 0.62, 0.35);
  for (const sx of [-1, 1]) put(g, B(0.22, 0.58, 0.92, mat, 0.07), sx * (w / 2 - 0.11), 0.31, 0);
  const n = w > 1.6 ? 2 : 1;
  for (let i = 0; i < n; i++) put(g, B((w - 0.48) / n - 0.03, 0.14, 0.66, mat, 0.06), -((w - 0.48) / 2) + ((w - 0.48) / n) * (i + 0.5), 0.46, -0.06);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) put(g, C(0.02, 0.02, 0.04, M.black, 6), sx * (w / 2 - 0.1), 0.02, sz * 0.38);
  blob(g, w + 0.5, 1.4);
  return g;
}
function armchair(p, x, z, ry = 0, mat = M.leather) {
  const g = grp(p, x, 0, z, ry);
  put(g, B(0.82, 0.36, 0.82, mat, 0.08), 0, 0.24, 0);
  put(g, B(0.82, 0.5, 0.2, mat, 0.08), 0, 0.62, 0.32, 0, -0.08);
  for (const sx of [-1, 1]) put(g, B(0.16, 0.5, 0.8, mat, 0.07), sx * 0.36, 0.34, 0);
  put(g, B(0.56, 0.12, 0.6, mat, 0.05), 0, 0.46, -0.04);
  blob(g, 1.2, 1.2);
  return g;
}
function lowTable(p, x, z, w = 1.2, d = 0.6, mat = M.stoneDark, h = 0.4) {
  const g = grp(p, x, 0, z);
  put(g, B(w, 0.05, d, mat, 0.02), 0, h, 0);
  put(g, B(w * 0.6, h - 0.02, d * 0.5, M.black, 0.02), 0, (h - 0.02) / 2, 0);
  blob(g, w + 0.3, d + 0.3);
  return g;
}
function rug(p, x, z, w, d, color) {
  return put(p, P(w, d, std({ map: rep(T.carpet, w / 2, d / 2), color, roughness: 1 })), x, 0.012, z, 0, -Math.PI / 2);
}
function bookshelf(p, x, z, ry = 0, w = 2.2, h = 3.2) {
  const g = grp(p, x, 0, z, ry);
  const D = 0.36;
  for (const sx of [-1, 1]) put(g, B(0.05, h, D, M.woodDark), sx * (w / 2 - 0.025), h / 2, 0);
  put(g, B(w, h, 0.02, M.woodDark), 0, h / 2, -D / 2 + 0.01);
  const shelves = 6, sh = (h - 0.1) / shelves;
  const books = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), M.book, shelves * 60);
  const tmp = new THREE.Object3D();
  const colors = ["#7a2e2a", "#2c4a6b", "#2f5a3f", "#b88a3b", "#5a3a5e", "#d8d0c0", "#1f2a36", "#8c5a2b", "#3d3d3d"].map((c) => new THREE.Color(c));
  let n = 0;
  for (let s = 0; s < shelves; s++) {
    const y0 = 0.05 + s * sh;
    put(g, B(w - 0.1, 0.03, D - 0.02, M.woodDark), 0, y0, 0);
    let bx = -w / 2 + 0.08;
    while (bx < w / 2 - 0.12 && n < books.count) {
      const bw = rnd(0.025, 0.06), bh = rnd(0.62, 0.92) * (sh - 0.06);
      if (Math.random() < 0.06) {
        bx += rnd(0.08, 0.2);
        continue;
      }
      tmp.position.set(bx + bw / 2, y0 + 0.015 + bh / 2, rnd(-0.02, 0.02));
      tmp.rotation.set(0, 0, Math.random() < 0.05 ? 0.15 : 0);
      tmp.scale.set(bw, bh, rnd(0.2, 0.28));
      tmp.updateMatrix();
      books.setMatrixAt(n, tmp.matrix);
      books.setColorAt(n, pick(colors));
      bx += bw + 0.003;
      n++;
    }
  }
  put(g, B(w, 0.04, D, M.woodDark), 0, h, 0);
  books.count = n;
  g.add(books);
  return g;
}
function pendant(p, x, z, ceilH, drop = 1.2, r = 0.22, mat = M.black) {
  const g = grp(p, x, ceilH, z);
  put(g, C(0.004, 0.004, drop, M.black, 4), 0, -drop / 2, 0);
  put(g, C(0.03, r, 0.24, mat, 24, true), 0, -drop - 0.12, 0);
  put(g, S(0.06, M.bulb, 10, 8), 0, -drop - 0.2, 0);
  return g;
}
function bankerLamp(p, x, y, z, ry = 0) {
  const g = grp(p, x, y, z, ry);
  put(g, C(0.08, 0.09, 0.03, M.brass, 16), 0, 0.015, 0);
  put(g, C(0.012, 0.012, 0.28, M.brass, 8), 0, 0.15, 0);
  const shade = put(g, mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.28, 16, 1, true, 0, Math.PI), std({ color: 0x1f6b3a, roughness: 0.2, side: THREE.DoubleSide })), 0, 0.31, 0.02, 0, 0, Math.PI / 2);
  shade.rotation.y = Math.PI / 2;
  put(g, C(0.02, 0.02, 0.2, M.bulb, 8), 0, 0.29, 0.02, 0, 0, Math.PI / 2);
  return g;
}
function cup(p, x, y, z, mat = M.white) {
  put(p, C(0.04, 0.035, 0.09, mat, 14), x, y + 0.045, z);
}
function column(p, x, z, h, r, mat) {
  put(p, C(r, r, h, mat, 40), x, h / 2, z);
  put(p, C(r + 0.06, r + 0.06, 0.12, M.brass, 40), x, 0.06, z);
}
function railing(p, x0, x1, z, h = 1.05, mat = M.steel, posts = 1.5) {
  rod(p, [x0, h, z], [x1, h, z], 0.025, mat);
  rod(p, [x0, h * 0.5, z], [x1, h * 0.5, z], 0.012, mat);
  for (let x = x0; x <= x1 + 0.01; x += posts) rod(p, [x, 0, z], [x, h, z], 0.02, mat);
}
function binoculars(p, x, z, ry = 0) {
  const g = grp(p, x, 0, z, ry);
  const paint = std({ color: 0x2c4f7a, metalness: 0.6, roughness: 0.35 });
  put(g, C(0.18, 0.24, 0.05, M.steelDark, 20), 0, 0.025, 0);
  put(g, C(0.05, 0.06, 1.05, paint, 14), 0, 0.55, 0);
  const head = grp(g, 0, 1.18, 0);
  head.rotation.x = -0.12;
  put(head, B(0.42, 0.2, 0.32, paint, 0.08), 0, 0, 0);
  for (const sx of [-0.09, 0.09]) {
    put(head, C(0.06, 0.07, 0.24, paint, 16), sx, 0.02, -0.24, 0, Math.PI / 2);
    put(head, C(0.045, 0.045, 0.02, M.glassTint, 16), sx, 0.02, -0.37, 0, Math.PI / 2);
    put(head, C(0.025, 0.03, 0.08, M.black, 12), sx * 0.7, 0.03, 0.2, 0, Math.PI / 2);
  }
  blob(g, 0.8, 0.8);
  return g;
}

// ---------- room shell: floor, ceiling, walls, the window wall and the lift lobby ----------
function solidWall(p, len, h, x, z, ry, mat, o) {
  const f = grp(p, x, 0, z, ry);
  put(f, P(len, h, mat), 0, h / 2, 0);
  put(f, B(len, 0.1, 0.02, o.base || M.charcoal), 0, 0.05, 0.01);
  if (o.wainscot) put(f, B(len, 1.1, 0.03, o.wainscot), 0, 0.55, 0.015);
  return f;
}
// floor-to-ceiling glass with mullions, and the tower's steel fins just outside it
function glassWall(p, len, h, x, z, ry, o) {
  const f = grp(p, x, 0, z, ry);
  const n = Math.max(2, Math.round(len / 1.55));
  const sp = len / n;
  const head = o.head ?? 0.35;
  for (let i = 0; i <= n; i++) {
    const mx = -len / 2 + i * sp;
    put(f, B(0.07, h, 0.12, M.mullion), mx, h / 2, -0.04);
    put(f, B(0.06, h + 0.6, 0.45, M.steel), mx, h / 2 - 0.3, -0.36);
  }
  put(f, B(len, head, 0.3, o.headMat || M.white), 0, h - head / 2, -0.1);
  put(f, B(len, 0.08, 0.36, M.mullion), 0, 0.04, -0.06);
  put(f, P(len, h - head, M.glass), 0, (h - head) / 2, -0.06);
  // the floor slab edge outside, so looking down shows the tower falling away
  put(f, B(len + 1, 0.6, 1.4, M.steelDark), 0, -0.3, -0.8);
  if (o.louvers) for (let y = 0.5; y < h - head; y += 0.32) put(f, B(len, 0.02, 0.22, M.steelDark), 0, y, -0.2, 0, 0.6);
  return f;
}
function liftWall(p, w, d, h, level, o) {
  const f = wallFrame(p, "back", w, d);
  const plaque = cvt(256, 80, (g, W, H) => {
    g.fillStyle = "#0b0b0c";

function candles(g, x, y, w, h, n, seed = 1) {
  let v = 50;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const o = v, c = v + rnd(-4, 4.6), hi = Math.max(o, c) + rnd(2), lo = Math.min(o, c) - rnd(2);
    pts.push([o, c, hi, lo]);
    v = c;
  }
  const all = pts.flat(), mn = Math.min(...all), mx = Math.max(...all);
  const sy = (q) => y + h - ((q - mn) / (mx - mn)) * h;
  const cw = w / n;
  g.strokeStyle = "rgba(255,255,255,0.06)";
  for (let k = 0; k < 6; k++) {
    g.beginPath();
    g.moveTo(x, y + (h / 5) * k);
    g.lineTo(x + w, y + (h / 5) * k);
    g.stroke();
  }
  pts.forEach(([o, c, hi, lo], i) => {
    const col = c >= o ? "#34d399" : "#f87171";
    g.strokeStyle = col;
    g.fillStyle = col;
    const cx = x + i * cw + cw / 2;
    g.beginPath();
    g.moveTo(cx, sy(hi));
    g.lineTo(cx, sy(lo));
    g.stroke();
    g.fillRect(cx - cw * 0.32, Math.min(sy(o), sy(c)), cw * 0.64, Math.max(2, Math.abs(sy(o) - sy(c))));
  });
}
function lineChart(g, x, y, w, h, color, n = 60, trend = 0.6) {
  let v = 0;
  const pts = [];
  for (let i = 0; i < n; i++) pts.push((v += rnd(-1, 1) + trend * 0.3));
  const mn = Math.min(...pts), mx = Math.max(...pts);
  const P2 = (i) => [x + (i / (n - 1)) * w, y + h - ((pts[i] - mn) / (mx - mn || 1)) * h];
  const grad = g.createLinearGradient(0, y, 0, y + h);
  grad.addColorStop(0, color + "55");
  grad.addColorStop(1, color + "00");
  g.beginPath();
  g.moveTo(x, y + h);
  for (let i = 0; i < n; i++) g.lineTo(...P2(i));
  g.lineTo(x + w, y + h);
  g.fillStyle = grad;
  g.fill();
  g.beginPath();
  for (let i = 0; i < n; i++) g[i ? "lineTo" : "moveTo"](...P2(i));
  g.strokeStyle = color;
  g.lineWidth = 3;
  g.stroke();
  g.lineWidth = 1;
}
function greyLines(g, x, y, w, n, lh = 22, color = "rgba(255,255,255,0.16)") {
  g.fillStyle = color;
  for (let i = 0; i < n; i++) g.fillRect(x, y + i * lh, w * rnd(0.55, 1), 8);
}

function flagTex(code) {

      else q.fillRect(0, (i * H) / cols.length, W, H / cols.length + 1);
    });

    else if (code === "IE") stripes(["#169b62", "#fff", "#ff883e"], true);

function roomSpire(c) {
  const g = c.g;
  const R = 3.2, H = 70;
  const lattice = std({ color: 0x8d969f, metalness: 1, roughness: 0.35 });
  put(g, C(R + 0.4, R + 0.4, 0.12, std({ map: rep(T.grating, 6, 6), roughness: 0.6, metalness: 0.6 }), 6), 0, -0.06, 0);
  const pts = (y) => Array.from({ length: 6 }, (_, i) => {
    const a = (i / 6) * Math.PI * 2;
    const r = R * (1 - (y / H) * 0.7);
    return [Math.cos(a) * r, y, Math.sin(a) * r];
  });
  for (let y = 0; y < H; y += 4) {
    const a = pts(y), b = pts(y + 4);
    for (let i = 0; i < 6; i++) {
      rod(g, a[i], b[i], 0.09, lattice, 8);
      rod(g, a[i], b[(i + 1) % 6], 0.04, lattice, 6);
      rod(g, b[i], b[(i + 1) % 6], 0.05, lattice, 6);
    }
  }
  // ladder up one face
  for (let y = 0; y < H - 4; y += 0.32) {
    const r = R * (1 - (y / H) * 0.7) - 0.35;
    rod(g, [-0.25, y, -r], [0.25, y, -r], 0.018, M.steel, 6);
  }
  for (const sx of [-0.25, 0.25]) rod(g, [sx, 0, -(R - 0.35)], [sx, H - 4, -(R * 0.3 - 0.35 + R * 0.06)], 0.025, M.steel, 6);
  // cage lamps on the way up
  for (let y = 3; y < H; y += 7) {
    const r = R * (1 - (y / H) * 0.7) - 0.1;
    put(g, S(0.07, M.bulb, 8, 6), r * 0.7, y, r * 0.7);
  }
  const beacon = put(g, S(0.35, M.redLed, 16, 12), 0, H - 1, 0);
  const red = new THREE.PointLight(0xff3b30, 30, 40, 2);
  red.position.set(0, H - 2, 0);
  g.add(red);
  c.updates.push((dt, t) => {
    const on = t % 1.5 < 0.3;
    beacon.visible = on;
    red.intensity = on ? 30 : 0;
  });
  const plate = grp(g, 1.2, 0, 1.2, -Math.PI * 0.75);
  put(plate, B(0.05, 1.1, 0.05, M.steelDark), 0, 0.55, 0);
  put(plate, P(0.8, 0.4, std({ map: signTex([{ t: "SPIRE · 828 M", y: 64, f: `800 100px ${FD}`, c: "#111" }], 1024, 128, { bg: "#f2c230" }) })), 0, 1.25, 0.03);
  const amb = new THREE.AmbientLight(0xbfd0ff, 0.6);
  g.add(amb);
  put(g, S(0.05, M.bulb), 0, 2.4, 0);
  const work = new THREE.PointLight(0xffe2b0, 8, 8, 2);
  work.position.set(0, 2.5, 0);

  return { y: 762, spawn: [0, 1.4], look: [0, 40, -1.5], walk: 0, maxPitch: 1.45, minPitch: -0.6, eye: 1.62 };

// the scale model in the lobby, built the same way as the real thing
function towerModel(scale) {
  const g = new THREE.Group();
  const mat = std({ color: 0xb9c6d2, metalness: 0.9, roughness: 0.2 });
  const Ht = 600, TIERS = 27, th = Ht / TIERS, L0 = 64, dL = 6.4;
  for (let k = 0; k < TIERS; k++) {
    const y0 = k * th, ww = 30 - k * 0.5;
    for (let w = 0; w < 3; w++) {
      let n = 0;
      for (let j = 3; j <= k; j++) if (j % 3 === w) n++;
      const len = L0 - n * dL;
      if (len < ww * 0.5 + 3) continue;
      const a = (w * 2 * Math.PI) / 3 + Math.PI / 2;
      put(g, B(len * scale, th * scale, ww * scale, mat), (Math.cos(a) * len * scale) / 2, (y0 + th / 2) * scale, (Math.sin(a) * len * scale) / 2, -a);
      put(g, C((ww / 2) * scale, (ww / 2) * scale, th * scale, mat, 16), Math.cos(a) * len * scale, (y0 + th / 2) * scale, Math.sin(a) * len * scale);
    }
    const rc = 20 - k * 0.36;
    put(g, C(rc * scale, rc * scale, th * scale, mat, 6), 0, (y0 + th / 2) * scale, 0);
  }
  put(g, C(0.35 * scale, 9 * scale, (TOP - Ht) * scale, M.steel, 12), 0, ((Ht + TOP) / 2) * scale, 0);
  return g;
}

const mood = { top: new THREE.Color(), hor: new THREE.Color(), gnd: new THREE.Color(), sun: new THREE.Color(), fog: new THREE.Color() };
function sampleMood(p) {
  let a = KEYS[0], b = KEYS[KEYS.length - 1];
  for (let i = 0; i < KEYS.length - 1; i++)
    if (p >= KEYS[i].p && p <= KEYS[i + 1].p) {
      a = KEYS[i];
      b = KEYS[i + 1];
      break;
    }
  const t = (p - a.p) / Math.max(1e-6, b.p - a.p);
  for (const k of ["top", "hor", "gnd", "sun", "fog"]) mood[k].copy(a[k]).lerp(b[k], t);
  for (const k of ["sunI", "hemi", "win", "stars", "el", "env"]) mood[k] = a[k] + (b[k] - a[k]) * t;
  return mood;
}
let cityMat, carMat, cloudMats = [];

const white = new THREE.Color(1, 1, 1);
function applyMood(metres) {

  skyU.sunDir.value.copy(sd);
  sun.position.copy(sd).multiplyScalar(2000).add(new THREE.Vector3(0, metres, 0));
  sun.target.position.set(0, metres, 0);
  sun.color.copy(m.sun);
  sun.intensity = m.sunI;
  hemi.color.copy(m.top).lerp(white, 0.55);
  hemi.groundColor.copy(m.gnd);
  hemi.intensity = m.hemi;
  scene.environmentIntensity = m.env;
  scene.fog.color.copy(m.fog);
  scene.fog.near = 150 + metres * 0.6;
  scene.fog.far = 3800 + metres * 3;
  cityMat.emissiveIntensity = m.win;

function buildOutside() {
  const ground = mesh(new THREE.PlaneGeometry(24000, 24000), std({ map: rep(T.sand, 300, 300), roughness: 1 }));
  put(scene, ground, 0, -0.05, 0, 0, -Math.PI / 2);
  put(scene, mesh(new THREE.CircleGeometry(150, 64), std({ map: rep(T.paving, 60, 60), roughness: 0.85 })), 0, -0.02, 0, 0, -Math.PI / 2);

  put(scene, mesh(new THREE.CircleGeometry(LAKE.r, 80), std({ color: 0x24587e, metalness: 0.9, roughness: 0.06 })), LAKE.x, 0.05, LAKE.z, 0, -Math.PI / 2);

  const jetPos = [];
  for (let i = 0; i < 40; i++) {

  }
  scene.add(jets);
  // roads on a grid, with traffic on two of them
  const roadMat = std({ color: 0x45494f, roughness: 0.9 });
  for (let k = -8; k <= 8; k++) {
    if (Math.abs(k) < 1) continue;
    put(scene, P(18, 12000, roadMat), k * 320, 0.02, 0, 0, -Math.PI / 2);
    put(scene, P(12000, 18, roadMat), 0, 0.02, k * 320 - 160, 0, -Math.PI / 2);
  }
  put(scene, P(40, 12000, roadMat), -480, 0.03, 0, 0, -Math.PI / 2);
  // city
  cityMat = std({ map: T.city, emissiveMap: T.cityLights, emissive: 0xffc98a, emissiveIntensity: 0, roughness: 0.5, metalness: 0.4 });
  const box = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  const N = 2200;
  const city = new THREE.InstancedMesh(box, cityMat, N);

  const tmp = new THREE.Object3D();
  const palette = ["#d9cdb6", "#c3ccd6", "#a9b8c8", "#e6dccb", "#8fa3b8", "#b9a88e", "#9fb4c4"].map((c) => new THREE.Color(c));
  let n = 0, nt = 0;
  for (let tries = 0; n < N && tries < N * 5; tries++) {
    const r = 230 + Math.pow(Math.random(), 0.8) * 3200;
    const a = Math.random() * Math.PI * 2;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r + 30) continue;
    const mx = ((x % 320) + 320) % 320, mz = (((z + 160) % 320) + 320) % 320;
    if (mx < 22 || mx > 298 || mz < 22 || mz > 298 || Math.abs(x + 480) < 40) continue;
    // keep the lake side open so the tower reads from the default view
    if (z < 0 && Math.abs(x) < 380 + -z * 0.25 && r < 1500) continue;
    const near = r < 1200 ? 0.9 : 0.75;
    const hgt = 10 + Math.pow(Math.random(), 2.4) * 240 * near;
    const sx = rnd(18, 50), sz = rnd(18, 50);
    tmp.position.set(x, 0, z);
    tmp.rotation.set(0, Math.random() < 0.8 ? 0 : rnd(0.6), 0);
    tmp.scale.set(sx, hgt, sz);
    tmp.updateMatrix();
    city.setMatrixAt(n, tmp.matrix);
    const col = pick(palette);
    city.setColorAt(n, col);
    n++;
    if (hgt > 60 && Math.random() < 0.5) {
      tmp.position.y = hgt;
      tmp.scale.set(sx * 0.6, hgt * rnd(0.1, 0.25), sz * 0.6);
      tmp.updateMatrix();
      tops.setMatrixAt(nt, tmp.matrix);
      tops.setColorAt(nt, col);
      nt++;
    }
  }
  city.count = n;
  tops.count = nt;
  scene.add(city, tops);
  // palms around the plaza
  const trunk = std({ color: 0x7a5c3e, roughness: 0.9 });
  for (let i = 0; i < 34; i++) {
    const a = (i / 34) * Math.PI * 2, r = rnd(100, 145);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.abs(x) < 20 && Math.abs(z) < 16) continue;
    const p = grp(scene, x, 0, z, rnd(6));
    const ht = rnd(7, 11);
    put(p, C(0.22, 0.35, ht, trunk, 8), 0, ht / 2, 0, 0, rnd(-0.06, 0.06));
    for (let k = 0; k < 9; k++) {
      const f = grp(p, 0, ht, 0, (k / 9) * Math.PI * 2);
      put(f, B(0.7, 0.04, 3.6, M.leaf), 0, -0.4, 1.6, 0, -0.45);
    }
  }
  // traffic
  carMat = std({ color: 0xffffff, roughness: 0.4, metalness: 0.5, emissive: 0xfff2d0, emissiveIntensity: 0 });
  const cars = new THREE.InstancedMesh(new THREE.BoxGeometry(2, 1.5, 4.6).translate(0, 0.75, 0), carMat, 260);
  const carCol = ["#f5f5f5", "#1d1f22", "#9aa3ad", "#b8322a", "#2f5a8a", "#e8e2d4"].map((c) => new THREE.Color(c));
  const lanes = [];
  for (let i = 0; i < 260; i++) {
    lanes.push({ road: i % 3, lane: (i % 4) - 1.5, off: rnd(12000), sp: rnd(16, 28) * (i % 2 ? 1 : -1) });
    cars.setColorAt(i, pick(carCol));
  }
  scene.add(cars);
  // clouds around 360–470 m
  const clouds = new THREE.Group();
  scene.add(clouds);
  for (let i = 0; i < 46; i++) {
    const m = new THREE.SpriteMaterial({ map: T.cloud, transparent: true, depthWrite: false, opacity: rnd(0.4, 0.75) });
    cloudMats.push(m);

    const r = rnd(160, 1400), a = rnd(Math.PI * 2);
    s.position.set(Math.cos(a) * r, rnd(360, 470), Math.sin(a) * r);
    const sc = rnd(160, 420);
    s.scale.set(sc, sc * 0.42, 1);
    clouds.add(s);
  }
  return (dt, t) => {
    for (let i = 0; i < 40; i++) {
      const hh = 12 + 55 * (0.5 + 0.5 * Math.sin(t * 1.6 + i * 0.35)) * (0.6 + 0.4 * Math.sin(t * 0.37 + i));
      tmp.position.set(jetPos[i][0], 0, jetPos[i][1]);
      tmp.rotation.set(0, 0, 0);
      tmp.scale.set(1, hh, 1);
      tmp.updateMatrix();
      jets.setMatrixAt(i, tmp.matrix);
    }
    jets.instanceMatrix.needsUpdate = true;
    lanes.forEach((c, i) => {
      const s = ((c.off + t * c.sp) % 12000 + 12000) % 12000 - 6000;

  };
}


// ---------- the tower from outside ----------
const exterior = new THREE.Group();

  const facade = shared(cvt(256, 256, (g, s) => {

  put(gate, P(12, 5.4, std({ color: 0x9fc3dc, metalness: 0.2, roughness: 0.05, emissive: 0xffd9a0, emissiveIntensity: 0.25 })), 0, 2.8, -21.9, Math.PI);

const bands = [];
const envelopeAt = (y) => (y < EH ? envelope[Math.min(TIERS - 1, Math.floor(y / TH))] : y < 700 ? 15 : 8);

// ---------- the current room ----------
let room = null;
function disposeRoom(r) {
  scene.remove(r.g);
  r.g.traverse((o) => {
    if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose();
    const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of ms)
      if (!m.userData.shared) {
        for (const k of ["map", "emissiveMap"]) if (m[k] && !m[k].userData.shared) m[k].dispose();
        m.dispose();
      }
  });
}

let mode = "outside";
const view = { x: 0, z: 0, yaw: 0, pitch: 0, tYaw: 0, tPitch: 0, walkYaw: 0, walk: 0, walkT: 1, eye: 1.62, min: -0.7, max: 0.75, baseYaw: 0 };
function buildRoom(i) {
  if (room) disposeRoom(room);
  const f = FLOORS[i];
  const c = { g: new THREE.Group(), updates: [], f };
  const spec = (ROOMS[f.id] || roomProject)(c, f);
  const y = spec.y ?? (f.m === 0 ? 0.05 : f.m);
  c.g.position.y = y;
  scene.add(c.g);
  c.g.updateMatrixWorld(true);
  // anything printed on a large panel is a board you can click
  const boards = [];
  c.g.traverse((o) => {
    const p = o.geometry?.parameters;
    const map = o.material?.map;
    if (!o.isMesh || o.material === M.shadow || o.geometry.type !== "PlaneGeometry" || !map || map.wrapS === THREE.RepeatWrapping) return;
    if (p.width * p.height >= 0.3) boards.push(o);
  });
  let spot;
  if (spec.hotspot) spot = new THREE.Vector3(spec.hotspot[0], spec.hotspot[1] + y, spec.hotspot[2]);
  else if (boards.length) {
    const big = boards.reduce((a, b) => (b.geometry.parameters.width * b.geometry.parameters.height > a.geometry.parameters.width * a.geometry.parameters.height ? b : a));
    const box = new THREE.Box3().setFromObject(big);
    spot = box.getCenter(new THREE.Vector3());
    spot.y = box.max.y + 0.2;
  }
  room = { g: c.g, updates: c.updates, y, boards, spot, i };
  view.x = spec.spawn[0];
  view.z = spec.spawn[1];
  view.eye = spec.eye || 1.62;
  const [tx, ty, tz] = spec.look;
  const dx = tx - view.x, dz = tz - view.z;
  view.yaw = view.tYaw = view.baseYaw = Math.atan2(-dx, -dz);
  view.pitch = view.tPitch = Math.atan2(ty - view.eye, Math.hypot(dx, dz));
  view.min = spec.minPitch ?? -0.7;
  view.max = spec.maxPitch ?? 0.75;
  view.walk = spec.walk ?? 2;
  view.walkYaw = 0;
  view.walkT = 0;

}

// ---------- outside camera: orbit the tower ----------

const v3 = new THREE.Vector3(), right = new THREE.Vector3(), fwd = new THREE.Vector3();
function project(p) {
  v3.copy(p).project(camera);
  return [((v3.x + 1) / 2) * innerWidth, ((1 - v3.y) / 2) * innerHeight, v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1];
}
function placeTags() {
  right.setFromMatrixColumn(camera.matrixWorld, 0);
  FLOORS.forEach((f, i) => {
    const y = f.m === 0 ? 14 : f.m;
    const side = i % 2 ? 1 : -1;
    const p = new THREE.Vector3().copy(right).multiplyScalar(side * envelopeAt(Math.max(3, f.m))).setY(y);
    const [x, sy, ok] = project(p);
    const t = tags[i];
    t.style.visibility = ok ? "visible" : "hidden";
    t.style.transform = `translate(${x | 0}px, ${sy | 0}px) translate(${side > 0 ? "14px" : "calc(-100% - 14px)"}, -50%)`;
    t.setAttribute("aria-current", String(i === focusIndex));
    t._y = sy;
    t._x = x;
    t._ok = ok;
  });
  // keep tags on the same side from overlapping: nudge them apart, keeping their order
  for (const side of [0, 1]) {
    const list = tags.filter((t, i) => i % 2 === side && t._ok).sort((a, b) => b._y - a._y);
    let last = Infinity;
    for (const t of list) {
      const y = Math.min(t._y, last - 26);
      last = y;
      t.style.transform = `translate(${t._x | 0}px, ${y | 0}px) translate(${side ? "14px" : "calc(-100% - 14px)"}, -50%)`;
    }

}
function placeSpot() {

    if (hit !== hover) {
      hover = hit;
      el.style.cursor = hit ? "pointer" : "";
      if (hit && mode === "inside") {
        highlight.setFromObject(hit);
        highlight.visible = true;
      } else highlight.visible = false;
    }
    return;
  }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX;
  drag.y = e.clientY;
  lastInput = performance.now();
  if (mode === "inside") {
    const k = e.pointerType === "touch" ? 0.006 : 0.0035;
    view.tYaw += dx * k;
    view.tPitch = clamp(view.tPitch + dy * k, view.min, view.max);
  } else if (!flying) {
    goal.th -= dx * 0.005;
    const k = goal.R * 0.0014;
    goal.y = clamp(goal.y + dy * k, 3, 900);
    goal.look = clamp(goal.look + dy * k, 5, 830);
  }
});
const endDrag = (e) => {
  if (drag && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) {
    const hit = pickAt(e.clientX, e.clientY);
    if (hit === gate) dispatchEvent(new CustomEvent("tower:gate"));
    else if (hit && mode === "outside") dispatchEvent(new CustomEvent("tower:pick", { detail: { index: hit.userData.floor } }));
    else if (hit && room) dispatchEvent(new CustomEvent("tower:board", { detail: { index: room.i } }));
  }
  drag = null;
};
el.addEventListener("pointerup", endDrag);
el.addEventListener("pointercancel", () => (drag = null));
addEventListener(
  "wheel",
  (e) => {
    if (mode !== "outside" || flying) return;
    if (e.target.closest && e.target.closest(".card, .rail, .modal")) return;
    e.preventDefault();
    goal.R = clamp(goal.R * (1 + e.deltaY * 0.0012), 90, 1700);
    lastInput = performance.now();
  },
  { passive: false }
);
addEventListener("keydown", (e) => {
  if (mode !== "inside") return;
  if (e.key === "ArrowLeft") view.tYaw += 0.35;
  else if (e.key === "ArrowRight") view.tYaw -= 0.35;
  else return;
  lastInput = performance.now();
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w > 820 ? 60 : 72;
  if (w > 820) camera.setViewOffset(w, h, w * 0.06, 0, w, h);
  else camera.setViewOffset(w, h, 0, h * 0.2, w, h);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

// ---------- frame loop ----------
let updateOutside;
let prev = performance.now(), first = true;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  const t = now / 1000;
  if (mode === "inside" && room) {
    if (view.arrived && view.walkT < 1) view.walkT = Math.min(1, view.walkT + dt / (reduceMotion ? 0.01 : 3.2));
    const k = view.arrived ? easeOut(view.walkT) : 0;
    const wx = view.x - Math.sin(view.walkYaw) * view.walk * k;
    const wz = view.z - Math.cos(view.walkYaw) * view.walk * k;
    // a gentle look-around when nobody touches anything
    if (!drag && !reduceMotion && now - lastInput > 8000 && view.arrived) view.tYaw = view.baseYaw + Math.sin((now - lastInput - 8000) / 6000) * 0.35;
    view.yaw += (view.tYaw - view.yaw) * Math.min(1, dt * 6);
    view.pitch += (view.tPitch - view.pitch) * Math.min(1, dt * 6);
    const bob = view.arrived && view.walkT < 1 && !reduceMotion ? Math.sin(view.walkT * 22) * 0.012 : 0;
    camera.position.set(wx, room.y + view.eye + bob, wz);
    camera.rotation.set(view.pitch, view.yaw, 0);
    for (const u of room.updates) u(dt, t);
    camera.updateMatrixWorld();
    placeSpot();
  } else {
    if (!drag && !flying && !reduceMotion && now - lastInput > 4000) goal.th += dt * 0.025;
    const s = Math.min(1, dt * (flying ? 1.9 : 2.2));
    for (const k of ["th", "R", "y", "look"]) orbit[k] += (goal[k] - orbit[k]) * s;
    moodNow += (moodGoal - moodNow) * Math.min(1, dt * 1.2);
    applyMood(moodNow);
    scene.fog.near = 1400;
    scene.fog.far = 7000;
    camera.position.set(Math.sin(orbit.th) * orbit.R, orbit.y, Math.cos(orbit.th) * orbit.R);
    camera.lookAt(0, orbit.look, 0);
    camera.updateMatrixWorld();
    bands.forEach((b, i) => (b.material.opacity = i === focusIndex ? 0.75 + Math.sin(t * 4) * 0.2 : 0.28));
    extBeacon.visible = now % 1500 < 260;
    placeTags();
  }
  sky.position.copy(camera.position);
  updateOutside(dt, t);
  renderer.render(scene, camera);
  if (first) {
    first = false;
    document.body.classList.add("gl-ready");
    dispatchEvent(new CustomEvent("tower:ready"));
  }
  requestAnimationFrame(frame);
}

(async () => {
  try {
    await Promise.race([
      Promise.all([`800 100px ${FD}`, `600 40px ${FM}`, `500 40px ${FM}`, `600 40px ${FB}`, `700 40px ${FH}`, `500 40px ${FH}`].map((f) => document.fonts.load(f))),
      new Promise((r) => setTimeout(r, 4000)),
    ]);
  } catch {}
  initTextures();
  initMaterials();
  updateOutside = buildOutside();
  buildExterior();
  resize();
  if (window.TOWER_FOCUS != null) {
    focusFloor(window.TOWER_FOCUS);
    Object.assign(orbit, goal);
    moodNow = moodGoal;
  }
  requestAnimationFrame(frame);
})();
</script>
